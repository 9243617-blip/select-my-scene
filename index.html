<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>SELECT MY SCENE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#101010;--panel:#191919;--ink:#f3f3f3;--muted:#858585;--line:#303030;--soft:#242424}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",sans-serif}
button,input,textarea{font:inherit}
.page{width:min(calc(100% - 40px),980px);margin:0 auto;padding:42px 0 28px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:1px solid #777;padding-bottom:16px}
h1{font-size:clamp(27px,5vw,36px);font-weight:700;letter-spacing:.015em;line-height:1;margin:0}
.edition{text-align:right;color:var(--muted);font-size:9px;letter-spacing:.15em;line-height:1.7}
.subhead{display:flex;justify-content:space-between;margin:11px 0 17px;color:var(--muted);font-size:9px;letter-spacing:.14em}
#films{display:flex;flex-direction:column;gap:0}
.film{display:grid;grid-template-columns:76px minmax(0,1fr);gap:15px;padding:13px 0 15px;border-bottom:1px solid var(--line);align-items:start}
.film-no{font-size:10px;color:#777;padding-top:5px;letter-spacing:.06em}
.poster{width:76px;height:114px;background:#242424;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#666;font-size:9px;letter-spacing:.1em;text-align:center}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster[data-poster-error]::after{content:attr(data-poster-error);font-size:9px;color:#888;text-align:center;padding:5px}
.film-main{min-width:0;max-width:490px;padding-top:2px}
.search-wrap{position:relative;max-width:390px}
.search{width:100%;height:28px;padding:3px 22px 5px 0;border:0;border-bottom:1px solid #444;background:transparent;color:var(--ink);font-size:14px;font-weight:650;outline:0}
.search::placeholder{color:#777;font-weight:400}
.search:focus{border-color:#bbb}
.search-icon{position:absolute;right:2px;top:5px;color:#777;font-size:12px}
.results{position:absolute;z-index:10;top:30px;left:0;width:min(100%,390px);max-height:260px;overflow:auto;background:#202020;border:1px solid #444;box-shadow:0 12px 28px #000b}
.result{display:flex;align-items:center;gap:10px;width:100%;padding:7px;border:0;border-bottom:1px solid #333;background:transparent;color:#eee;text-align:left;cursor:pointer}
.result:hover{background:#2a2a2a}
.result img,.result .no-poster{width:32px;height:48px;object-fit:cover;background:#303030;flex:none}
.result .no-poster{display:grid;place-items:center;color:#777;font-size:7px}
.result b{display:block;font-size:11px;font-weight:600}
.result small{display:block;color:#888;font-size:10px;margin-top:3px}
.movie-line{display:flex;align-items:baseline;gap:7px;margin-top:3px;min-height:19px}
.movie-title{font-size:15px;font-weight:650;line-height:1.3}
.year{font-size:12px;color:#888}
.director{font-size:12px;color:#aaa;margin-top:1px;min-height:16px}
.stars{display:flex;gap:3px;margin-top:2px}
.star{border:0;background:none;padding:0;color:#555;font-size:15px;line-height:1;cursor:pointer}
.star.active{color:#f5c542}
.scenes{margin-top:6px;display:flex;flex-direction:column;gap:5px;max-width:470px}
.scene-row{display:flex;align-items:flex-start;gap:0}
.scene-bullet{color:#ddd;font-size:12px;line-height:23px;flex:none}
.scene{flex:1;min-width:0;min-height:23px;height:23px;max-height:90px;resize:vertical;border:0;border-bottom:1px solid transparent;outline:0;background:transparent;color:#eee;padding:2px 0;font-size:12px;line-height:1.55}
.scene:focus{border-bottom-color:#555}
.scene::placeholder{color:transparent}
.remove-scene{border:0;background:transparent;color:#777;font-size:10px;padding:5px 0;cursor:pointer}
.scene-actions{margin:5px 0 0 18px}
.text-btn{border:0;background:transparent;color:#999;font-size:10px;padding:3px 0;cursor:pointer}
.text-btn:hover{color:#fff}
.film-actions{display:flex;gap:12px;margin:7px 0 0 0;flex-wrap:wrap}
.delete-film{color:#777}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px;padding-top:15px;border-top:1px solid #555}
.btn{border:1px solid #eee;background:#eee;color:#111;padding:9px 14px;font-size:10px;font-weight:600;letter-spacing:.06em;cursor:pointer}
.btn.ghost{background:transparent;color:#eee;border-color:#555}
.footer{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #555;margin-top:27px;padding-top:12px;color:#777;font-size:9px;letter-spacing:.13em}
.settings{margin-top:22px;border:1px solid #333;padding:13px}
.settings summary{font-size:10px;letter-spacing:.1em;color:#aaa;cursor:pointer}
.settings-inner{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.settings input{flex:1;min-width:210px;background:#151515;border:1px solid #444;color:#eee;padding:9px;font-size:11px}
.hint{font-size:10px;color:#777;line-height:1.65;margin:9px 0 0}
.no-film{color:#777;font-size:11px;padding:18px 0}

.archive-layout{margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:35px;align-items:start}
.archive-films{min-width:0}
.profile{border-left:1px solid var(--line);padding:18px 0 16px 24px;min-width:0}
.profile-heading{font-size:10px;letter-spacing:.18em;color:#888;margin-bottom:19px}
.profile-photo{display:flex;align-items:center;justify-content:center;width:94px;height:94px;border-radius:50%;overflow:hidden;background:#292929;color:#777;font-size:10px;cursor:pointer;margin-bottom:14px}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.profile-name{width:100%;background:none;border:0;border-bottom:1px solid #444;color:#f4f4f4;padding:5px 0;font-size:15px;font-weight:650;outline:none}
.profile-note{display:block;width:100%;min-height:88px;background:none;border:0;border-bottom:1px solid #444;color:#ccc;resize:vertical;padding:10px 0;font-size:12px;line-height:1.65;outline:none}
.profile-name::placeholder,.profile-note::placeholder{color:#666}
.profile-upload{display:inline-block;color:#999;font-size:10px;margin-top:10px;cursor:pointer}
.profile-static-name{font-size:15px;font-weight:650;overflow-wrap:anywhere}
.profile-static-note{font-size:12px;color:#ccc;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;margin-top:10px}
@media(max-width:650px){.archive-layout{grid-template-columns:minmax(0,1fr);gap:22px}.profile{grid-row:1;border-left:0;border-bottom:1px solid var(--line);padding:0 0 20px}.profile-photo{width:74px;height:74px}.profile-heading{margin-bottom:12px}}

@media(max-width:520px){
 .page{width:calc(100% - 28px);padding-top:28px}
 .film{grid-template-columns:60px minmax(0,1fr);gap:10px;padding:11px 0 13px}
 .poster{width:60px;height:90px}
 .film-main{max-width:none}
 .scenes{max-width:none}
 .movie-title{font-size:14px}
 .scene{font-size:11px}
}

/* Compact, predictable export composition */
#capture-export{box-sizing:border-box!important}
#capture-export .archive-layout{grid-template-columns:minmax(0,1fr) 178px;gap:22px;margin-top:17px}
#capture-export .profile{padding:10px 0 8px 18px}
#capture-export .film{grid-template-columns:70px minmax(0,1fr);gap:12px;padding:10px 0 11px;min-height:0;align-items:start}
#capture-export .poster{width:70px;height:105px}
#capture-export .film-main{max-width:none;padding-top:0}
#capture-export .movie-line{margin-top:1px;min-height:19px}
#capture-export .director{margin-top:2px;min-height:16px}
#capture-export .stars{margin-top:4px}
#capture-export .scenes{margin-top:9px;max-width:100%;gap:0;min-height:0}
#capture-export .scene-export{font-size:12px;line-height:1.55;color:#eee;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:0}
#capture-export .footer{margin-top:12px}
#capture-export .profile-photo{width:88px;height:88px}

@media print{.no-print,.search-wrap,.film-actions{display:none!important}.page{width:100%;padding:10px}.film{break-inside:avoid}}
</style>
</head>
<body>
<main class="page" id="capture">
<header><h1>SELECT MY SCENE</h1><div class="edition">A PERSONAL FILM ARCHIVE<br>FILMS / MOMENTS / MEMORIES</div></header>

<div class="archive-layout">
<div class="archive-films"><section id="films"></section></div>
<aside class="profile" id="profile">
 <div class="profile-heading">ABOUT THE CURATOR</div>
 <label class="profile-photo" for="profile-file" id="profile-photo"><span>PHOTO</span></label>
 <input type="file" accept="image/png,image/jpeg,image/webp" id="profile-file" hidden>
 <input id="profile-name" class="profile-name" maxlength="45" placeholder="닉네임" aria-label="닉네임">
 <textarea id="profile-note" class="profile-note" maxlength="600" placeholder="할 말" aria-label="할 말"></textarea>
 <label for="profile-file" class="profile-upload">사진 선택 / 변경</label>
</aside>
</div>
<footer class="footer"><span>SELECT MY SCENE</span></footer>
</main>

<section class="page no-print" style="padding-top:0">
<div class="controls">
 <button class="btn" id="add-film">＋ ADD FILM</button>
 <button class="btn ghost" id="download">DOWNLOAD PNG</button>
 <button class="btn ghost" id="print">PRINT / PDF</button>
</div>
<p class="hint" style="margin-top:15px">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const DATA_KEY='select10scene-v2',PROFILE_KEY='selectmyscene-profile-v1';
// After deploying your Cloudflare Worker, paste its public URL below (no trailing slash).
const WORKER_URL='https://select-my-scene-api.9243617.workers.dev';
const validPoster=(url)=>typeof url==='string' && /^https:\/\/image\.tmdb\.org\/t\/p\/(?:w185|w342|w500|original)\/[a-zA-Z0-9_.-]+$/.test(url);
const validProfile=(url)=>typeof url==='string' && /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(url) && url.length<1500000;

let films;
try{films=JSON.parse(localStorage.getItem(DATA_KEY)||'null')}catch(e){films=null}
if(!Array.isArray(films)) films=[newFilm(),newFilm(),newFilm()];
films=films.slice(0,10).filter(f=>f && typeof f==='object').map(f=>({...f,scenes:[String((Array.isArray(f.scenes)?f.scenes: [''])[0]||'').slice(0,2500)],rating:Math.max(0,Math.min(5,Number(f.rating)||0)),movie:f.movie&&typeof f.movie==='object'?{...f.movie,poster:validPoster(f.movie.poster)?f.movie.poster:''}:null}));

const root=document.getElementById('films');
let profile={name:'',note:'',photo:''};
try{profile={...profile,...JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}}catch(e){}
const profileName=document.getElementById('profile-name'),profileNote=document.getElementById('profile-note'),profilePhoto=document.getElementById('profile-photo');
profileName.value=profile.name;profileNote.value=profile.note;
function drawProfile(){profilePhoto.replaceChildren();if(validProfile(profile.photo)){const img=document.createElement('img');img.alt='프로필 사진';img.src=profile.photo;profilePhoto.appendChild(img)}else{const span=document.createElement('span');span.textContent='PHOTO';profilePhoto.appendChild(span)}}
function storeProfile(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profile))}catch(e){alert('사진이 너무 커서 저장할 수 없습니다. 다른 사진을 선택해 주세요.')}}
profileName.addEventListener('input',()=>{profile.name=profileName.value;storeProfile()});
profileNote.addEventListener('input',()=>{profile.note=profileNote.value;storeProfile()});
document.getElementById('profile-file').addEventListener('change',e=>{
 const file=e.target.files?.[0];if(!file)return;
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8*1024*1024){alert('8MB 이하의 JPG, PNG, WEBP 이미지를 선택해 주세요.');return}
 const reader=new FileReader();reader.onload=()=>{
  const img=new Image();img.onload=()=>{
   const canvas=document.createElement('canvas');canvas.width=320;canvas.height=320;
   const ctx=canvas.getContext('2d');if(!ctx)return;const side=Math.min(img.width,img.height);
   ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,320,320);
   profile.photo=canvas.toDataURL('image/jpeg',.83);storeProfile();drawProfile();
  };img.onerror=()=>alert('이미지를 읽을 수 없습니다.');img.src=reader.result;
 };reader.readAsDataURL(file);
});
drawProfile();

// Preserve older third notes while enforcing a maximum of two fields.
let migratedNotes=false;
films.forEach(f=>{
 if(Array.isArray(f.scenes)&&f.scenes.length>1){
  f.scenes=[f.scenes.filter(Boolean).join('\n')];
  migratedNotes=true;
 }
});
if(migratedNotes)localStorage.setItem(DATA_KEY,JSON.stringify(films));
function newFilm(){return {id:Date.now()+Math.random(),movie:null,scenes:[''],rating:0}}
function save(){localStorage.setItem(DATA_KEY,JSON.stringify(films));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 root.innerHTML='';
 films.forEach((f,i)=>{
  const movie=f.movie;
  const poster=validPoster(movie?.poster)?`<img src="${esc(movie.poster)}" alt="영화 포스터" onerror="this.style.display='none';this.parentElement.dataset.posterError='포스터 로딩 실패'">`:'<span>POSTER</span>';
  const el=document.createElement('article');el.className='film';el.dataset.id=f.id;
  el.innerHTML=`<div class="poster">${poster}</div>
   <div class="film-main">
    <div class="search-wrap">
     <input class="search" type="search" autocomplete="off" placeholder="영화 제목 검색" aria-label="영화 검색">
     <span class="search-icon">⌕</span><div class="results" hidden></div>
    </div>
    ${movie?`<div class="movie-line"><span class="movie-title">${esc(movie.title)}</span><span class="year">${esc(movie.year)}</span></div><div class="director">${esc(movie.director||'')}</div>`:''}
    <div class="stars">${[1,2,3,4,5].map(n=>`<button class="star ${f.rating>=n?'active':''}" data-star="${n}" aria-label="${n}점">★</button>`).join('')}</div>
    <div class="scenes">${f.scenes.map((v,j)=>`<div class="scene-row"><textarea class="scene" rows="1" data-scene="${j}">${esc(v)}</textarea></div>`).join('')}</div>
    
    <div class="film-actions"><button class="text-btn delete-film" data-delete-film>영화 삭제</button></div>
   </div>`;
  root.appendChild(el);
  const search=el.querySelector('.search'), box=el.querySelector('.results');
  let timer;
  search.addEventListener('input',()=>{
   clearTimeout(timer);const q=search.value.trim();
   if(!q){box.hidden=true;box.innerHTML='';return}
   timer=setTimeout(()=>searchMovies(q,box,f.id),320);
  });
  search.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(timer);searchMovies(search.value.trim(),box,f.id)}});
  el.querySelectorAll('[data-star]').forEach(b=>b.addEventListener('click',()=>{f.rating=+b.dataset.star;save()}));
  el.querySelectorAll('.scene').forEach(t=>{
   const resize=()=>{t.style.height='auto';t.style.height=Math.min(Math.max(t.scrollHeight,23),90)+'px'};
   t.addEventListener('input',()=>{f.scenes[+t.dataset.scene]=t.value;localStorage.setItem(DATA_KEY,JSON.stringify(films));resize()});resize();
  });
  el.querySelectorAll('[data-add-scene]').forEach(b=>b.addEventListener('click',()=>{if(f.scenes.length<1){f.scenes=[''];save()}}));
  el.querySelectorAll('[data-remove-scene]').forEach(b=>b.addEventListener('click',()=>{f.scenes.splice(+b.dataset.removeScene,1);if(!f.scenes.length)f.scenes=[''];save()}));
  el.querySelector('[data-delete-film]').addEventListener('click',()=>{if(confirm('이 영화 칸을 삭제할까요?')){films.splice(i,1);save()}});
 });

}
async function searchMovies(q,box,id){
 if(WORKER_URL.includes('REPLACE_WITH_YOUR_WORKER')){box.hidden=false;box.textContent='관리자가 영화 검색 서버를 연결해야 합니다.';return}
 box.hidden=false;box.innerHTML='<div class="result"><span style="font-size:11px;color:#aaa">검색 중…</span></div>';
 try{
  const u=`${WORKER_URL}/search?query=${encodeURIComponent(q)}`;
  const r=await fetch(u,{referrerPolicy:'no-referrer'});if(!r.ok)throw Error('검색 오류: API 키를 확인해 주세요.');
  const data=await r.json();box.innerHTML='';
  (data.results||[]).slice(0,12).forEach(m=>{
   const p=typeof m.poster_path==='string' && /^\/[a-zA-Z0-9_.-]+$/.test(m.poster_path)?'https://image.tmdb.org/t/p/w500'+m.poster_path:'';
   const b=document.createElement('button');b.className='result';
   b.innerHTML=`${p?`<img src="${p}" alt="">`:'<span class="no-poster">NO POSTER</span>'}<span><b>${esc(m.title||m.original_title||'제목 없음')}</b><small>${(m.release_date||'').slice(0,4)||'연도 미상'}</small></span>`;
   b.addEventListener('click',()=>chooseMovie(id,m,p));box.appendChild(b);
  });
  if(!data.results?.length)box.innerHTML='<div class="result"><span style="font-size:11px;color:#aaa">검색 결과가 없습니다.</span></div>';
 }catch(e){box.innerHTML=`<div class="result"><span style="font-size:11px;color:#aaa">${esc(e.message)}</span></div>`}
}
async function chooseMovie(id,m,poster){
 const f=films.find(x=>x.id===id);if(!f)return;
 let director='';
 try{const r=await fetch(`${WORKER_URL}/credits?id=${encodeURIComponent(m.id)}`,{referrerPolicy:'no-referrer'});if(r.ok){const d=await r.json();director=(d.crew||[]).filter(x=>x.job==='Director').map(x=>x.name).join(', ')}}
 catch(e){}
 f.movie={id:m.id,title:m.title||m.original_title||'',year:(m.release_date||'').slice(0,4),director,poster};
 save();
}
document.getElementById('add-film').addEventListener('click',()=>{if(films.length>=10){alert('영화는 최대 10편까지 추가할 수 있어요.');return}films.push(newFilm());save()});

document.getElementById('print').addEventListener('click',()=>window.print());
document.getElementById('download').addEventListener('click',async()=>{
 let exportNode;
 try{
  const source=document.getElementById('capture');
  exportNode=source.cloneNode(true);
  exportNode.id='capture-export';
  exportNode.style.cssText='position:fixed;left:0;top:0;z-index:-1;pointer-events:none;width:760px;max-width:none;margin:0;padding:24px 22px 18px;background:#101010;';
  exportNode.querySelectorAll('.search-wrap,.film-actions,.scene-actions').forEach(n=>n.remove());
  const p=exportNode.querySelector('#profile');
  p.querySelector('#profile-file').remove();
  p.querySelector('.profile-upload').remove();
  p.querySelector('#profile-name').replaceWith(Object.assign(document.createElement('div'),{className:'profile-static-name',textContent:profile.name}));
  p.querySelector('#profile-note').replaceWith(Object.assign(document.createElement('div'),{className:'profile-static-note',textContent:profile.note}));
  p.querySelector('#profile-photo').removeAttribute('for');
  exportNode.querySelectorAll('.film').forEach(card=>{
   if(!card.querySelector('.movie-title')){card.remove();return}
   card.querySelectorAll('.scene-row').forEach(row=>{
    const field=row.querySelector('textarea');
    if(!field || !field.value.trim()){row.remove();return}
    const text=document.createElement('div');
    text.textContent=field.value.trim();
    text.className='scene-export';
    row.replaceWith(text);
   });
  });
  document.body.appendChild(exportNode);
  await document.fonts.ready;
  await Promise.all([...exportNode.querySelectorAll('img')].map(img=>img.decode?img.decode().catch(()=>{}):Promise.resolve()));
  if(typeof html2canvas!=='function')throw Error('PNG library unavailable');
  const canvas=await html2canvas(exportNode,{backgroundColor:'#101010',scale:2,useCORS:true,logging:false,windowWidth:1100,scrollX:0,scrollY:0});
  const link=document.createElement('a');link.download='select-my-scene.png';link.href=canvas.toDataURL('image/png');link.click();
 }catch(e){alert('PNG 저장에 실패했습니다. 포스터가 모두 로드된 뒤 다시 시도해 주세요.')}
 finally{if(exportNode)exportNode.remove()}
});
render();
</script>
</body>
</html>
